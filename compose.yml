name: aws-ops-toolkit
services:
  aws:
    image: motoserver/moto:5.2.2
    entrypoint: [python, /lab/moto_server.py]
    ports:
      - "127.0.0.1:4566:5000"
    environment:
      MOTO_PORT: "5000"
      MOTO_DOCKER_NETWORK_NAME: aws-ops-toolkit-lab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./lab:/lab:ro
    networks: [lab]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 3s
      timeout: 2s
      retries: 30
    mem_limit: 1g
    cpus: 2
  payments:
    image: python:3.13.7-slim
    command: [python, /lab/payments.py]
    volumes:
      - ./lab:/lab:ro
    ports:
      - "127.0.0.1:8091:8091"
    networks: [lab]
    mem_limit: 128m
    cpus: 1
networks:
  lab:
    name: aws-ops-toolkit-lab
