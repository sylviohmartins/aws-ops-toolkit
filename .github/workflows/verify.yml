name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 - verify and local smoke
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TOOLKIT_AWS_ENABLED: 'false'
      TOOLKIT_WRITE_ENABLED: 'false'
      TOOLKIT_ENVIRONMENT: LOCAL
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        # https://github.com/actions/setup-java/releases/tag/v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify, format checks and static analysis
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify -Pstatic-analysis

      - name: Local smoke without AWS credentials
        timeout-minutes: 5
        run: .\scripts\smoke.ps1
