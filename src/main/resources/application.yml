spring:
  application:
    name: aws-ops-toolkit
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
logging:
  file:
    name: .aws-ops-toolkit/logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  structured:
    format:
      file: logstash
toolkit:
  environment: LOCAL
  data-directory: .aws-ops-toolkit/data
  minimum-free-bytes: 1073741824
  max-concurrent-operations: 2
  page-size: 100
  write-enabled: false
  local-token: ${TOOLKIT_LOCAL_TOKEN:}
  aws:
    enabled: false
    region: ${AWS_REGION:us-east-1}
    profile: ${AWS_PROFILE:}
    expected-account: ${TOOLKIT_EXPECTED_ACCOUNT:}
    max-connections: 8
    connection-timeout-millis: 3000
    acquisition-timeout-millis: 2000
    socket-timeout-millis: 25000
    max-idle-millis: 30000
    api-call-attempt-timeout-millis: 30000
    api-call-timeout-millis: 35000
operations:
  enabled: false
  writes: false
  requests-per-second: 10
  workers: 2
  page-size: 100
  plan-lifetime-seconds: 86400
  approval-lifetime-seconds: 900
  retention-days: 30
  http-connect-timeout-millis: 3000
  http-response-timeout-millis: 10000
  http-max-attempts: 3
  http-max-retry-after-seconds: 10
